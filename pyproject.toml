[project]
name = "cs2props"
version = "0.1.0"
description = "+EV 4-leg PrizePicks slip finder for CS2 player props with correlation modeling"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[project.scripts]
cs2props = "cs2props.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs2props"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
